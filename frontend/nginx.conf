# nginx del contenedor del frontend (ver frontend/Dockerfile).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Archivos de la carga masiva y documentos del apoderado (el backend limita a 10 MB).
  client_max_body_size 11m;

  # API → contenedor "backend" (docker-compose.yml). El backend ya usa el prefijo /api.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # Archivos con hash en el nombre: se pueden guardar en caché por mucho tiempo.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Aplicación de una sola página: cualquier ruta (/app/admin/usuarios…) carga index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
