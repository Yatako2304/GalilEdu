# GalilEdu en producción (un servidor con Docker, p. ej. AWS EC2).
# Uso:  docker compose --env-file deploy/.env up -d --build
# Guía completa: docs/guias/despliegue.md
#
#   Internet :80/:443 ──► caddy ──► frontend (nginx) ──/api──► backend (Spring Boot) ──► db (PostgreSQL 18)
#
# Solo caddy queda expuesto (80 y 443). Con DOMINIO en deploy/.env, caddy obtiene el certificado HTTPS de
# Let's Encrypt y lo renueva solo; sin DOMINIO sirve por HTTP en el 80, como antes (ver deploy/Caddyfile).
# Backend y base de datos no son accesibles desde fuera (la base escucha en 127.0.0.1:5432 del servidor,
# para entrar por túnel SSH).

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: galiledu
      POSTGRES_USER: galiledu
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en deploy/.env}
    volumes:
      # Los datos sobreviven aunque se apague el servidor o se reconstruyan los contenedores.
      - datos_postgres:/var/lib/postgresql
    ports:
      # Solo dentro del servidor (127.0.0.1): desde internet sigue cerrada. Para consultarla con un cliente
      # de base de datos, entra con un túnel SSH al servidor y conéctate a localhost:5432.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galiledu -d galiledu"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/galiledu
      DB_USER: galiledu
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en deploy/.env}
      # Mismo dominio que el frontend (nginx reenvía /api), así que CORS solo necesita el propio sitio.
      CORS_ORIGINS: ${URL_PUBLICA:-http://localhost}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/datos-prueba}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-responder@galiledu.edu.pe}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
      # Pago en línea (HU-41): "simulada" no cobra; con "stripe" se necesitan las llaves de Stripe.
      PASARELA_PAGOS: ${PASARELA_PAGOS:-simulada}
      URL_FRONTEND: ${URL_PUBLICA:-http://localhost}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Inicio de sesión con Google (HU-2 y HU-3): sin estas llaves el botón de Google no aparece.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Sin puertos propios: le llega el tráfico desde caddy por la red interna de Docker.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      # Vacío = HTTP en el puerto 80 (IP del servidor). Con dominio (p. ej. galiledu.duckdns.org) = HTTPS.
      DOMINIO: ${DOMINIO:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados y su configuración: sobreviven a los despliegues (Let's Encrypt limita cuántos se piden).
      - datos_caddy:/data
      - config_caddy:/config

volumes:
  datos_postgres:
  datos_caddy:
  config_caddy:
