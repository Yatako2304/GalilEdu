spring.application.name=galiledu-backend

# La base de datos de desarrollo y produccion debe ser PostgreSQL 18.
# Las credenciales se suministran fuera del repositorio.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema se gestionara mediante migraciones; JPA no debe crearlo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
