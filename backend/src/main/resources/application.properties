spring.application.name=galiledu-backend

# La base de datos de desarrollo y produccion debe ser PostgreSQL 18.
# Las credenciales se suministran fuera del repositorio.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo entregara el equipo de BD; JPA no debe crearlo ni modificarlo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sesion de navegador de RF/RNF: cerrar tras 30 minutos de inactividad.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
# En despliegue HTTPS configurar SESSION_COOKIE_SECURE=true.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
