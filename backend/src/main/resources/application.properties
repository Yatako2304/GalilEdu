spring.application.name=galiledu-backend

# Carga opcional de la configuracion local ignorada por Git (backend/.env).
# Las variables del entorno siguen teniendo prioridad y permiten el despliegue sin .env.
spring.config.import=optional:file:./.env[.properties]

# PostgreSQL 18. Credenciales fuera del repositorio (ver .env.example).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/galiledu}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo crea Flyway (src/main/resources/db/migration). JPA no lo toca.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/datos-prueba}
spring.flyway.schemas=personas,seguridad,estudiantes,configuracion,matricula,pagos
spring.flyway.default-schema=public

# API REST bajo /api (el frontend usa VITE_APP_API_URL=http://localhost:8080/api).
server.servlet.context-path=/api
server.port=${PORT:8080}

# JWT: secreto HS256 de al menos 32 caracteres. Cambiarlo en cualquier despliegue.
galiledu.jwt.secreto=${JWT_SECRET:desarrollo-local-cambiar-este-secreto-de-32+caracteres}
galiledu.jwt.duracion-horas=${JWT_HORAS:8}
# Origen del frontend permitido por CORS (separar con comas si hay varios).
galiledu.cors.origenes=${CORS_ORIGINS:http://localhost:3000}

# Correo para enviar credenciales (RF-17). Sin MAIL_HOST las credenciales solo se escriben en el log.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
galiledu.correo.remitente=${MAIL_FROM:no-responder@galiledu.edu.pe}

# Archivos adjuntos: carga masiva hasta 10 MB; cada servicio valida su propio límite (documento del apoderado: 5 MB).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Chequeo de salud (/api/actuator/health, usado por Docker): el correo es opcional, así que no debe
# marcar la app como caída si no hay SMTP configurado o si Gmail no responde.
management.health.mail.enabled=false
